name: gada

services:
  mongo:
    image: mongo:7.0
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    image: gada-electronics:dev
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGO_URI: mongodb://mongo:27017/gada_electronics
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the .env file}
      APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      mongo:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  mongo-data:
