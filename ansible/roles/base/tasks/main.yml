- name: Install base packages
  ansible.builtin.apt:
    name: [curl, htop, jq, ufw, ca-certificates, unattended-upgrades]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set hostname from the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Harden SSH with a drop-in file
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # managed by ansible
      PermitRootLogin no
      PasswordAuthentication no
      MaxAuthTries 3
      X11Forwarding no
      ClientAliveInterval 300
      ClientAliveCountMax 2
  notify: Reload ssh

- name: Check the SSH config is valid before anything reloads it
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Allow SSH through the host firewall
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Enable the firewall and deny everything else inbound
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Map the new hostname in /etc/hosts so sudo can resolve it
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ inventory_hostname }}"
