- name: Refuse to deploy without an explicit version
  ansible.builtin.assert:
    that: app_version is defined
    fail_msg: "Pass the image tag: -e app_version=<commit SHA>"

- name: Create the app stack directory
  ansible.builtin.file:
    path: /opt/gada-app
    state: directory
    mode: "0750"

- name: Write the environment file (secrets)
  ansible.builtin.template:
    src: app.env.j2
    dest: /opt/gada-app/app.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Write the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/gada-app/compose.yml
    mode: "0644"

- name: Write the nginx config
  ansible.builtin.copy:
    src: nginx.conf
    dest: /opt/gada-app/nginx.conf
    mode: "0644"

- name: Allow HTTP through the host firewall
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Start the app and nginx
  community.docker.docker_compose_v2:
    project_src: /opt/gada-app
    state: present
    wait: true
    wait_timeout: 120
