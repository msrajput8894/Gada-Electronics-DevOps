apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gada-app
  namespace: gada
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gada-app
                port:
                  number: 80
