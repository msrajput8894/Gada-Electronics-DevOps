version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: terraform
    directory: /infra/envs/k3s
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/envs/backups
    schedule:
      interval: weekly
