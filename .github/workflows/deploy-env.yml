name: Deploy to one environment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_DEFAULT_REGION: ap-south-1
      ENVIRONMENT: ${{ inputs.environment }}
      VERSION: ${{ inputs.version }}
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: Validate the version
        run: |
          [[ "$VERSION" =~ ^[0-9a-f]{40}$ ]] || { echo "version must be a 40-character commit SHA"; exit 1; }

      - name: Assume the AWS role through OIDC
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          CREDS=$(aws sts assume-role-with-web-identity --role-arn "$ROLE_ARN" --role-session-name "gh-$GITHUB_RUN_ID" --web-identity-token "$TOKEN" --duration-seconds 900 --query Credentials --output json)
          for k in AccessKeyId SecretAccessKey SessionToken; do
            echo "::add-mask::$(jq -r ".$k" <<<"$CREDS")"
          done
          {
            echo "AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<"$CREDS")"
            echo "AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<"$CREDS")"
            echo "AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<"$CREDS")"
          } >> "$GITHUB_ENV"

      - name: Find the app server for this environment
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=$ENVIRONMENT" "Name=tag:Role,Values=app" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          if [ -z "$ID" ] || [ "$(wc -w <<<"$ID")" -ne 1 ]; then
            echo "expected exactly one running app server in $ENVIRONMENT, found: '$ID'"
            exit 1
          fi
          echo "INSTANCE_ID=$ID" >> "$GITHUB_ENV"

      - name: Run gada-deploy on the server through SSM
        run: |
          CMD=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $VERSION to $ENVIRONMENT (run $GITHUB_RUN_ID)" \
            --parameters "commands=[\"/usr/local/bin/gada-deploy $VERSION\"]" \
            --query Command.CommandId --output text)
          echo "SSM command id: $CMD"
          sleep 3
          status=0
          aws ssm wait command-executed --command-id "$CMD" --instance-id "$INSTANCE_ID" || status=$?
          echo "---- status ----"
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" --query Status --output text
          echo "---- output ----"
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "---- errors ----"
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          exit $status

      - name: Summary
        if: success()
        run: echo "Deployed $VERSION to $ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
